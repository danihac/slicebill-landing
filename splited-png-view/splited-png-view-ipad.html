<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>SliceBill iPad Pro 13" Theme Split Composite</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Kontener symulujący proporcje iPada Pro 13" (2064x2752 px / punkty logiczne 1032x1376) */
    .ipad-container {
      position: relative;
      width: 1032px;
      height: 1376px;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      border: 6px solid #262626;
      background-color: #000;
    }

    /* Warstwa spodu: Dark Theme */
    .theme-dark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('dark.png');
      background-size: cover;
      background-position: center;
    }

    /* Warstwa wierzchnia: Light Theme z ukośnym cięciem (clip-path) */
    .theme-light {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('light.png');
      background-size: cover;
      background-position: center;
      /* Ukośne cięcie od 75% szerokości na górze do 25% na dole */
      clip-path: polygon(0 0, 75% 0, 25% 100%, 0 100%);
    }

    /* Linia podziału / separator */
    .divider-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="ipad-container">
    <!-- Dark Theme (Spód) -->
    <div class="theme-dark"></div>

    <!-- Light Theme (Góra z cięciem) -->
    <div class="theme-light"></div>

    <!-- Biała linia akcentowa wzdłuż cięcia (75% z 1032 = 774, 25% z 1032 = 258) -->
    <svg class="divider-line" viewBox="0 0 1032 1376">
      <line x1="774" y1="0" x2="258" y2="1376" stroke="#FFFFFF" stroke-width="4" opacity="0.9" />
    </svg>
  </div>

</body>
</html>
